# llama.cpp server runtime for Plane AI.
# Used by the main docker-compose.yml through `extends` (profile "llama-cpp").
# Reads the shared GGUF directly from the model volume (no copy). No published
# ports: reachable only on the internal network as http://plane-ai-llm:8080
# (OpenAI-compatible API under /v1).

services:
  plane-ai-llama-cpp:
    image: ${PLANE_AI_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    init: true
    environment:
      # llama-server reads LLAMA_ARG_* variables as CLI flags.
      LLAMA_ARG_MODEL: /models/${PLANE_AI_LLM_MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      LLAMA_ARG_ALIAS: ${PLANE_AI_LLM_MODEL_NAME:-qwen3.5-2b}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: ${PLANE_AI_LLM_CONTEXT_LENGTH:-8192}
      LLAMA_ARG_THREADS: ${PLANE_AI_LLM_THREADS:-4}
      LLAMA_ARG_N_PARALLEL: "1"
      # 8-bit K cache: less memory for the context. Prompt prefixes are cached and reused between requests.
      LLAMA_ARG_CACHE_TYPE_K: ${PLANE_AI_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ${PLANE_AI_MODEL_VOLUME:-plane-ai-models}:/models:ro
    networks:
      plane-ai-internal:
        aliases: [plane-ai-llm]
    healthcheck:
      # /health returns 200 only after the model is loaded.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "${PLANE_AI_LLM_CPUS:-4}"
          memory: ${PLANE_AI_LLM_MEMORY:-6g}
