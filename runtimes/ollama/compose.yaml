# Ollama runtime for Plane AI.
# Used by the main docker-compose.yml through `extends` (profile "ollama").
# Serves the shared GGUF from the model volume. No published ports: reachable
# only on the internal network as http://plane-ai-llm:11434.

services:
  plane-ai-ollama:
    image: ${PLANE_AI_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "/opt/plane-ai/entrypoint.sh"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${PLANE_AI_LLM_IDLE_SECONDS:-300}s
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Flash attention + an 8-bit KV cache: about half the attention memory, same answers in practice.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${PLANE_AI_KV_CACHE_TYPE:-q8_0}
      # Optional LoRA adapter (GGUF) in the model volume, trained from the exported training data.
      PLANE_AI_LORA_ADAPTER: ${PLANE_AI_LORA_ADAPTER:-}
      PLANE_AI_LLM_MODEL_FILE: ${PLANE_AI_LLM_MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      PLANE_AI_LLM_MODEL_NAME: ${PLANE_AI_LLM_MODEL_NAME:-qwen3.5-2b}
      PLANE_AI_LLM_CONTEXT_LENGTH: ${PLANE_AI_LLM_CONTEXT_LENGTH:-8192}
    volumes:
      - ${PLANE_AI_MODEL_VOLUME:-plane-ai-models}:/models:ro
      - plane-ai-ollama-data:/root/.ollama
      - ./entrypoint.sh:/opt/plane-ai/entrypoint.sh:ro
    networks:
      plane-ai-internal:
        aliases: [plane-ai-llm]
    healthcheck:
      # Healthy only once the shared model is imported and available.
      test: ["CMD", "ollama", "show", "${PLANE_AI_LLM_MODEL_NAME:-qwen3.5-2b}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "${PLANE_AI_LLM_CPUS:-4}"
          memory: ${PLANE_AI_LLM_MEMORY:-6g}
